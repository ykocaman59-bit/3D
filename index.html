<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Oyun Topluluğu - Saklambaç Haritası</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0f19; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; pointer-events: none; text-shadow: 1px 1px 2px black; z-index: 10; font-size: 14px; }
        #joystick-area { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); z-index: 10; }
        #stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.6); border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui"><b>Oyun Topluluğu - Saklambaç Haritası</b><br>Sol alttan yürü, sağ ekrana dokunup etrafa bak!</div>
    <div id="joystick-area"><div id="stick"></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0e1626);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Işıklar
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Zemin
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(35, 30),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Harita Odaları (Harita planına birebir uygun yerleşim)
        function createRoom(x, z, w, d, color, name) {
            const roomFloor = new THREE.Mesh(
                new THREE.PlaneGeometry(w - 0.2, d - 0.2),
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 })
            );
            roomFloor.rotation.x = -Math.PI / 2;
            roomFloor.position.set(x, 0.02, z);
            scene.add(roomFloor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
            const h = 2.0;
            
            // Duvarlar
            const nw = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.3), wallMat);
            nw.position.set(x, h/2, z - d/2);
            scene.add(nw);
            const sw = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.3), wallMat);
            sw.position.set(x, h/2, z + d/2);
            scene.add(sw);
            const ew = new THREE.Mesh(new THREE.BoxGeometry(0.3, h, d), wallMat);
            ew.position.set(x + w/2, h/2, z);
            scene.add(ew);
            const ww = new THREE.Mesh(new THREE.BoxGeometry(0.3, h, d), wallMat);
            ww.position.set(x - w/2, h/2, z);
            scene.add(ww);
        }

        // Plan Ölçülerine Göre Odalar
        createRoom(-7, -6, 4, 3, 0x475569, "Ahır/Depo");
        createRoom(-3, -6, 4, 3, 0xd97706, "Mutfak");
        createRoom(1, -6, 4, 3, 0x3b82f6, "Giriş Holü");
        createRoom(5, -6, 4, 3, 0x0284c7, "Oturma Odası");
        createRoom(9, -6, 4, 3, 0xec4899, "Yatak Odası");

        createRoom(-7, -2, 4, 3, 0x0ea5e9, "Banyo");
        createRoom(-3, -2, 4, 3, 0xb45309, "Yemek Odası");
        createRoom(1, -2, 4, 3, 0x475569, "Merdiven / Koridor");
        createRoom(5, -2, 4, 3, 0x64748b, "Çalışma Odası");
        createRoom(9, -2, 4, 3, 0x334155, "Garaj");

        createRoom(1, 3, 10, 4, 0x15803d, "Teras / Bahçe");
        createRoom(8, 4, 5, 4, 0x166534, "Kamelya");

        // Joystick ve Kamera Kontrolü
        let lon = 0, lat = 0;
        let isTouching = false, touchStartX = 0, touchStartY = 0;
        const joystickArea = document.getElementById('joystick-area');
        const stick = document.getElementById('stick');
        let joyCenterX = 0, joyCenterY = 0, joyTouchId = null;
        let dirX = 0, dirY = 0;

        joystickArea.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            joyTouchId = touch.identifier;
            const rect = joystickArea.getBoundingClientRect();
            joyCenterX = rect.left + rect.width / 2;
            joyCenterY = rect.top + rect.height / 2;
        });

        joystickArea.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joyTouchId) {
                    let dx = touch.clientX - joyCenterX;
                    let dy = touch.clientY - joyCenterY;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let maxDist = 40;
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    stick.style.transform = `translate(${dx}px, ${dy}px)`;
                    dirX = dx / maxDist;
                    dirY = dy / maxDist;
                }
            }
        });

        joystickArea.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    joyTouchId = null;
                    stick.style.transform = `translate(0px, 0px)`;
                    dirX = 0; dirY = 0;
                }
            }
        });

        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX > window.innerWidth / 2) {
                    isTouching = true;
                    touchStartX = e.touches[i].clientX;
                    touchStartY = e.touches[i].clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX > window.innerWidth / 2) {
                    let deltaX = e.touches[i].clientX - touchStartX;
                    let deltaY = e.touches[i].clientY - touchStartY;
                    lon -= deltaX * 0.3;
                    lat += deltaY * 0.3;
                    lat = Math.max(-80, Math.min(80, lat));
                    touchStartX = e.touches[i].clientX;
                    touchStartY = e.touches[i].clientY;
                }
            }
        });

        window.addEventListener('touchend', () => { isTouching = false; });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (dirX !== 0 || dirY !== 0) {
                const speed = 5 * delta;
                const rad = THREE.MathUtils.degToRad(lon);
                camera.position.x += (-dirY * Math.sin(rad) - dirX * Math.cos(rad)) * speed;
                camera.position.z += (-dirY * Math.cos(rad) + dirX * Math.sin(rad)) * speed;
            }

            let phi = THREE.MathUtils.degToRad(90 - lat);
            let theta = THREE.MathUtils.degToRad(lon);
            let target = new THREE.Vector3(
                camera.position.x + 100 * Math.sin(phi) * Math.cos(theta),
                camera.position.y + 100 * Math.cos(phi),
                camera.position.z + 100 * Math.sin(phi) * Math.sin(theta)
            );
            camera.lookAt(target);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
