<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Saklambaç Haritası</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">Oyun Topluluğu - 3D Harita<br>Ekranı kaydırarak etrafa bak</div>

    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Sahne, Kamera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122); // Lacivert gökyüzü

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 10); // Kamerayı dışarıya konumlandırdık

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Işıklar
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        // Zemin
        const floorGeo = new THREE.PlaneGeometry(40, 40);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Harita Odaları (Farklı renklerde kutular)
        function addBox(x, z, w, d, color, name) {
            const geom = new THREE.BoxGeometry(w, 3, d);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(x, 1.5, z);
            scene.add(mesh);
        }

        // Odaları yerleştiriyoruz (Kameranın önünü kapatmayacak şekilde etrafa)
        addBox(-6, -6, 4, 4, 0xff5555, "Mutfak (Kırmızı)");
        addBox(6, -6, 4, 4, 0x5555ff, "Yatak Odası (Mavi)");
        addBox(-6, 6, 4, 4, 0xffaa00, "Oturma Odası (Turuncu)");
        addBox(6, 6, 4, 4, 0xaa00aa, "Garaj (Mor)");

        // Dokunmatik Kontrol Değişkenleri
        let isDragging = false;
        let previousX = 0, previousY = 0;
        let lon = 0, lat = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousX = e.touches[0].clientX;
                previousY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;

            let deltaX = e.touches[0].clientX - previousX;
            let deltaY = e.touches[0].clientY - previousY;

            lon -= deltaX * 0.5;
            lat += deltaY * 0.5;
            lat = Math.max(-85, Math.min(85, lat));

            previousX = e.touches[0].clientX;
            previousY = e.touches[0].clientY;

            updateCamera();
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        // Fare Desteği (Bilgisayardan test etmek istersen)
        window.addEventListener('mousedown', (e) => { isDragging = true; previousX = e.clientX; previousY = e.clientY; });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let deltaX = e.clientX - previousX;
            let deltaY = e.clientY - previousY;
            lon -= deltaX * 0.5;
            lat += deltaY * 0.5;
            lat = Math.max(-85, Math.min(85, lat));
            previousX = e.clientX;
            previousY = e.clientY;
            updateCamera();
        });

        function updateCamera() {
            let phi = THREE.MathUtils.degToRad(90 - lat);
            let theta = THREE.MathUtils.degToRad(lon);

            let target = new THREE.Vector3();
            target.x = camera.position.x + 100 * Math.sin(phi) * Math.cos(theta);
            target.y = camera.position.y + 100 * Math.cos(phi);
            target.z = camera.position.z + 100 * Math.sin(phi) * Math.sin(theta);

            camera.lookAt(target);
        }

        updateCamera();

        // Döngü
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Ekran Boyutu Değişimi
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
