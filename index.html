<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Saklambaç Haritası - Gezinti</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 15px;
            pointer-events: none;
            text-shadow: 1px 1px 3px black;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">Oyun Topluluğu - Harita Gezintisi<br>Parmağınla ekranda kaydırarak etrafa bak</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let lon = 0, lat = 0;
        let touchX = 0, touchY = 0;
        let isTouching = false;

        function init() {
            // Sahne ve Kamera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 8); // Kamerayı odaların dışına, güvenli bir noktaya koyduk

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Işıklar
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Zemin (Büyük Oyun Alanı)
            const floorGeo = new THREE.PlaneGeometry(30, 30);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Harita Odaları (Etrafta konumlandırıldı, kamerayı kapatmaz)
            createRoom(-5, 0, -4, 4, 3, 0x3498db, "Mutfak");   // Mavi
            createRoom(5, 0, -4, 4, 3, 0xe74c3c, "Yatak Odası"); // Kırmızı
            createRoom(0, 0, -8, 5, 3, 0xf1c40f, "Oturma Odası");// Sarı
            createRoom(0, 0, 4, 6, 3, 0x2ecc71, "Bahçe");      // Yeşil (artık ileride)

            // Dokunmatik Kontroller (Mobil Uyumlu)
            document.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isTouching = true;
                    touchX = e.touches[0].clientX;
                    touchY = e.touches[0].clientY;
                }
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                if (!isTouching || e.touches.length !== 1) return;

                let deltaX = e.touches[0].clientX - touchX;
                let deltaY = e.touches[0].clientY - touchY;

                lon -= deltaX * 0.4;
                lat += deltaY * 0.4;
                lat = Math.max(-85, Math.min(85, lat));

                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;

                updateCameraRotation();
            }, { passive: false });

            document.addEventListener('touchend', () => { isTouching = false; });

            // Bilgisayar Mouse Desteği (Test için)
            let isMouseDown = false;
            document.addEventListener('mousedown', (e) => { isMouseDown = true; touchX = e.clientX; touchY = e.clientY; });
            document.addEventListener('mouseup', () => { isMouseDown = false; });
            document.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                let deltaX = e.clientX - touchX;
                let deltaY = e.clientY - touchY;
                lon -= deltaX * 0.4;
                lat += deltaY * 0.4;
                lat = Math.max(-85, Math.min(85, lat));
                touchX = e.clientX;
                touchY = e.clientY;
                updateCameraRotation();
            });

            window.addEventListener('resize', onWindowResize);
            updateCameraRotation();
        }

        function createRoom(x, y, z, width, depth, colorHex, name) {
            const geometry = new THREE.BoxGeometry(width, 2.5, depth);
            const material = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4 });
            const room = new THREE.Mesh(geometry, material);
            room.position.set(x, y + 1.25, z);
            scene.add(room);
        }

        function updateCameraRotation() {
            let phi = THREE.MathUtils.degToRad(90 - lat);
            let theta = THREE.MathUtils.degToRad(lon);

            let target = new THREE.Vector3();
            target.x = camera.position.x + 100 * Math.sin(phi) * Math.cos(theta);
            target.y = camera.position.y + 100 * Math.cos(phi);
            target.z = camera.position.z + 100 * Math.sin(phi) * Math.sin(theta);

            camera.lookAt(target);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
