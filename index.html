<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Saklambaç Haritası - Gezinti</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">Oyun Topluluğu - Harita Gezintisi<br>Ekranı kaydırarak etrafa bakabilirsin</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let rooms = [];

        function init() {
            // Sahne ve Kamera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5); // İnsan gözü hizası

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Işıklandırma
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffaa55, 1, 50);
            pointLight.position.set(0, 4, 0);
            scene.add(pointLight);

            // Zemin (Oyun Alanı)
            const floorGeo = new THREE.PlaneGeometry(15, 12);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x3b2f2f, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Basit Odalar / Duvar Taslakları (Harita Planına Göre)
            createRoom(-4, 0, -3, 4, 3, 0x557799, "Mutfak");
            createRoom(4, 0, -3, 4, 3, 0x995555, "Yatak Odası");
            createRoom(0, 0, 3, 6, 3, 0x559955, "Bahçe / Kamelya");

            // Dokunmatik / Mouse Kontrolü için Değişkenler
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let lon = 0, lat = 0;

            document.addEventListener('mousedown', (e) => { isDragging = true; });
            document.addEventListener('mouseup', () => { isDragging = false; });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                let deltaX = e.clientX - previousMousePosition.x;
                let deltaY = e.clientY - previousMousePosition.y;

                lon -= deltaX * 0.2;
                lat += deltaY * 0.2;
                lat = Math.max(-85, Math.min(85, lat));

                updateCameraRotation();
            });

            // Mobil Dokunmatik Desteği
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) {
                    let touch = e.touches[0];
                    if (previousMousePosition.x) {
                        let deltaX = touch.clientX - previousMousePosition.x;
                        lon -= deltaX * 0.3;
                        updateCameraRotation();
                    }
                    previousMousePosition.x = touch.clientX;
                }
            }, { passive: true });

            document.addEventListener('touchend', () => { previousMousePosition.x = 0; });

            window.addEventListener('resize', onWindowResize);
        }

        function createRoom(x, y, z, width, depth, colorHex, name) {
            const geometry = new THREE.BoxGeometry(width, 2.5, depth);
            const material = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5, wireframe: false });
            const room = new THREE.Mesh(geometry, material);
            room.position.set(x, y + 1.25, z);
            scene.add(room);
        }

        function updateCameraRotation() {
            let phi = THREE.MathUtils.degToRad(90 - lat);
            let theta = THREE.MathUtils.degToRad(lon);

            let target = new THREE.Vector3();
            target.x = camera.position.x + 100 * Math.sin(phi) * Math.cos(theta);
            target.y = camera.position.y + 100 * Math.cos(phi);
            target.z = camera.position.z + 100 * Math.sin(phi) * Math.sin(theta);

            camera.lookAt(target);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
