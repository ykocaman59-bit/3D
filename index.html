<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Oyun Topluluğu - Saklambaç Haritası</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1e1b18; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; pointer-events: none; text-shadow: 1px 1px 2px black; z-index: 10; font-size: 14px; }
        #joystick-area { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); z-index: 10; }
        #stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div id="ui"><b>Oyun Topluluğu - Saklambaç Haritası</b><br>Sol alttan yürü, sağ ekrana dokunup etrafa bak!</div>
    <div id="joystick-area"><div id="stick"></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2421);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Sıcak Ev Işıkları
        scene.add(new THREE.AmbientLight(0xffedd5, 0.9));
        const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.8);
        dirLight.position.set(15, 25, 15);
        scene.add(dirLight);

        // Odaları ve Eşya Detaylarını Oluşturan Fonksiyon
        function createDetailedRoom(x, z, w, d, floorColor, wallColor, roomName) {
            // Zemin
            const roomFloor = new THREE.Mesh(
                new THREE.PlaneGeometry(w - 0.1, d - 0.1),
                new THREE.MeshStandardMaterial({ color: floorColor, roughness: 0.5 })
            );
            roomFloor.rotation.x = -Math.PI / 2;
            roomFloor.position.set(x, 0.01, z);
            scene.add(roomFloor);

            // Duvarlar
            const wallMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.8 });
            const h = 2.2;
            
            const nw = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.2), wallMat);
            nw.position.set(x, h/2, z - d/2);
            scene.add(nw);
            const sw = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.2), wallMat);
            sw.position.set(x, h/2, z + d/2);
            scene.add(sw);
            const ew = new THREE.Mesh(new THREE.BoxGeometry(0.2, h, d), wallMat);
            ew.position.set(x + w/2, h/2, z);
            scene.add(ew);
            const ww = new THREE.Mesh(new THREE.BoxGeometry(0.2, h, d), wallMat);
            ww.position.set(x - w/2, h/2, z);
            scene.add(ww);

            // Odaların İçindeki Mobilya/Eşya Temsili Kutular (Görsellerdeki Dolap, Koltuk vb.)
            const itemMat = new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.4 });
            const item = new THREE.Mesh(new THREE.BoxGeometry(w * 0.4, 0.8, d * 0.4), itemMat);
            item.position.set(x, 0.4, z);
            scene.add(item);
        }

        // Plandaki Renkli Odalar ve Yerleşimleri
        createDetailedRoom(-7, -6, 4, 3, 0x475569, 0x334155, "Ahır/Depo");
        createDetailedRoom(-3, -6, 4, 3, 0xd97706, 0xb45309, "Mutfak");
        createDetailedRoom(1, -6, 4, 3, 0xfde047, 0xca8a04, "Giriş Holü");
        createDetailedRoom(5, -6, 4, 3, 0x0284c7, 0x0369a1, "Oturma Odası");
        createDetailedRoom(9, -6, 4, 3, 0xf43f5e, 0xbe123c, "Yatak Odası");

        createDetailedRoom(-7, -2, 4, 3, 0x38bdf8, 0x0284c7, "Banyo");
        createDetailedRoom(-3, -2, 4, 3, 0xb45309, 0x78350f, "Yemek Odası");
        createDetailedRoom(1, -2, 4, 3, 0x64748b, 0x475569, "Merdiven / Koridor");
        createDetailedRoom(5, -2, 4, 3, 0x94a3b8, 0x64748b, "Çalışma Odası");
        createDetailedRoom(9, -2, 4, 3, 0x334155, 0x1e293b, "Garaj");

        createDetailedRoom(1, 3, 10, 4, 0x15803d, 0x166534, "Teras / Bahçe");
        createDetailedRoom(8, 4, 5, 4, 0x166534, 0x14532d, "Kamelya");

        // Düzeltilmiş Joystick ve Kamera Hareket Matematiği
        let lon = 0, lat = 0;
        let isTouching = false, touchStartX = 0, touchStartY = 0;
        const joystickArea = document.getElementById('joystick-area');
        const stick = document.getElementById('stick');
        let joyCenterX = 0, joyCenterY = 0, joyTouchId = null;
        let dirX = 0, dirY = 0;

        joystickArea.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            joyTouchId = touch.identifier;
            const rect = joystickArea.getBoundingClientRect();
            joyCenterX = rect.left + rect.width / 2;
            joyCenterY = rect.top + rect.height / 2;
        });

        joystickArea.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joyTouchId) {
                    let dx = touch.clientX - joyCenterX;
                    let dy = touch.clientY - joyCenterY;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let maxDist = 40;
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    stick.style.transform = `translate(${dx}px, ${dy}px)`;
                    dirX = dx / maxDist;
                    dirY = dy / maxDist; // İleri-geri yönü düzeltildi
                }
            }
        });

        joystickArea.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    joyTouchId = null;
                    stick.style.transform = `translate(0px, 0px)`;
                    dirX = 0; dirY = 0;
                }
            }
        });

        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX > window.innerWidth / 2) {
                    isTouching = true;
                    touchStartX = e.touches[i].clientX;
                    touchStartY = e.touches[i].clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX > window.innerWidth / 2) {
                    let deltaX = e.touches[i].clientX - touchStartX;
                    let deltaY = e.touches[i].clientY - touchStartY;
                    lon -= deltaX * 0.4;
                    lat += deltaY * 0.4;
                    lat = Math.max(-80, Math.min(80, lat));
                    touchStartX = e.touches[i].clientX;
                    touchStartY = e.touches[i].clientY;
                }
            }
        });

        window.addEventListener('touchend', () => { isTouching = false; });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (dirX !== 0 || dirY !== 0) {
                const speed = 6 * delta;
                const rad = THREE.MathUtils.degToRad(lon);
                // Kamera açısına göre tam doğru yönde yürüme matrisi
                camera.position.x += (dirY * Math.sin(rad) + dirX * Math.cos(rad)) * speed;
                camera.position.z += (-dirY * Math.cos(rad) + dirX * Math.sin(rad)) * speed;
            }

            let phi = THREE.MathUtils.degToRad(90 - lat);
            let theta = THREE.MathUtils.degToRad(lon);
            let target = new THREE.Vector3(
                camera.position.x + 100 * Math.sin(phi) * Math.cos(theta),
                camera.position.y + 100 * Math.cos(phi),
                camera.position.z + 100 * Math.sin(phi) * Math.sin(theta)
            );
            camera.lookAt(target);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
