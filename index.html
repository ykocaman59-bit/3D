<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Oyun Topluluğu - Saklambaç Haritası</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050811; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Oda Arka Plan Görseli */
        #game-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            transition: background-image 0.3s ease-in-out;
        }

        /* Üst Bar (Saklanma Sayacı ve Süre) */
        #top-bar {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 30; pointer-events: none;
        }
        .badge {
            background: rgba(0, 0, 0, 0.65); color: white; padding: 7px 15px;
            border-radius: 20px; font-size: 13px; font-weight: bold; border: 1px solid rgba(255,255,255,0.25);
        }
        .timer { background: rgba(0, 0, 0, 0.75); color: #fbbf24; }

        /* Harita Butonu (Sağ Üst) */
        #map-btn {
            position: absolute; top: 70px; right: 15px;
            background: #1e293b; color: white; border: 2px solid white;
            padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: bold;
            cursor: pointer; z-index: 30; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Aktif Oda İsmi (Sol Alt Üstü) */
        #room-indicator {
            position: absolute; bottom: 120px; left: 25px;
            background: rgba(0, 0, 0, 0.7); color: white; padding: 6px 16px;
            border-radius: 8px; font-size: 15px; font-weight: bold; z-index: 30;
            border-left: 4px solid #3b82f6;
        }

        /* Sol Alt Joystick */
        #joystick-area {
            position: absolute; bottom: 25px; left: 25px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3); z-index: 30; touch-action: none;
        }
        #stick {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.85); border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: none;
            transition: transform 0.05s ease-out;
        }

        /* Sağ Alt Aksiyon Tuşları (Objeye Dönüş / Karakter) */
        #right-buttons {
            position: absolute; bottom: 25px; right: 25px;
            display: flex; flex-direction: column; gap: 12px; z-index: 30;
        }
        .action-btn {
            width: 60px; height: 60px; background: #3b82f6; border-radius: 50%;
            border: 3px solid white; color: white; font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); cursor: pointer;
        }
        .action-btn.secondary { background: #1e293b; }

        /* Harita Seçim Ekranı (Modal) */
        #map-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.95); z-index: 50; display: flex;
            flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
        }
        #map-modal h2 { color: white; margin-bottom: 15px; font-size: 20px; text-align: center; }
        .room-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            width: 100%; max-width: 400px; max-height: 70vh; overflow-y: auto; padding-right: 5px;
        }
        .room-card {
            background: #1e293b; color: white; padding: 12px; border-radius: 10px;
            text-align: center; font-size: 14px; font-weight: bold; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .room-card:active { background: #3b82f6; }
        #close-map {
            margin-top: 15px; background: #ef4444; color: white; border: none;
            padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-screen"></div>

    <!-- Üst Bar -->
    <div id="top-bar">
        <div class="badge">👤 Saklan: 16/16</div>
        <div class="badge timer">⏱️ 03:00</div>
    </div>

    <!-- Harita Açma Butonu -->
    <div id="map-btn" onclick="toggleMap(true)">🗺️ Harita</div>

    <!-- Aktif Oda Göstergesi -->
    <div id="room-indicator">Giriş Holü</div>

    <!-- Sol Alt Joystick -->
    <div id="joystick-area">
        <div id="stick"></div>
    </div>

    <!-- Sağ Alt Butonlar -->
    <div id="right-buttons">
        <div class="action-btn secondary" onclick="transformObject()">📦</div>
        <div class="action-btn" onclick="interactAction()">✨</div>
    </div>

    <!-- Harita / Oda Seçim Paneli -->
    <div id="map-modal">
        <h2>Oyun Topluluğu - Harita Seçimi</h2>
        <div class="room-grid">
            <div class="room-card" onclick="selectRoom('Giriş Holü', 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200&auto=format&fit=crop')">Giriş Holü</div>
            <div class="room-card" onclick="selectRoom('Mutfak', 'https://images.unsplash.com/photo-1556911220-e15b29be8c8f?q=80&w=1200&auto=format&fit=crop')">Mutfak</div>
            <div class="room-card" onclick="selectRoom('Oturma Odası', 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?q=80&w=1200&auto=format&fit=crop')">Oturma Odası</div>
            <div class="room-card" onclick="selectRoom('Yatak Odası', 'https://images.unsplash.com/photo-1595526114035-0d45ed16cfbf?q=80&w=1200&auto=format&fit=crop')">Yatak Odası</div>
            <div class="room-card" onclick="selectRoom('Banyo', 'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=1200&auto=format&fit=crop')">Banyo</div>
            <div class="room-card" onclick="selectRoom('Yemek Odası', 'https://images.unsplash.com/photo-1615529162924-f8605388461d?q=80&w=1200&auto=format&fit=crop')">Yemek Odası</div>
            <div class="room-card" onclick="selectRoom('Merdiven', 'https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1200&auto=format&fit=crop')">Merdiven</div>
            <div class="room-card" onclick="selectRoom('Çalışma Odası', 'https://images.unsplash.com/photo-1524758631624-e2822e304c36?q=80&w=1200&auto=format&fit=crop')">Çalışma Odası</div>
            <div class="room-card" onclick="selectRoom('Garaj', 'https://images.unsplash.com/photo-1506521781263-d8422e82f27a?q=80&w=1200&auto=format&fit=crop')">Garaj</div>
            <div class="room-card" onclick="selectRoom('Bahçe / Kamelya', 'https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?q=80&w=1200&auto=format&fit=crop')">Bahçe / Kamelya</div>
        </div>
        <button id="close-map" onclick="toggleMap(false)">Oyuna Dön</button>
    </div>

    <script>
        // Harita / Oda Değiştirme Mantığı
        function selectRoom(roomName, imageUrl) {
            document.getElementById('room-indicator').innerText = roomName;
            document.getElementById('game-screen').style.backgroundImage = `url('${imageUrl}')`;
            toggleMap(false);
        }

        function toggleMap(show) {
            document.getElementById('map-modal').style.display = show ? 'flex' : 'none';
        }

        function transformObject() {
            alert('📦 Dönüşüm tamamlandı! Oyuncu objeye dönüştü.');
        }

        function interactAction() {
            alert('✨ Etkileşim gerçekleştirildi!');
        }

        // Sol Alt Joystick Dokunma Efekti
        const joystickArea = document.getElementById('joystick-area');
        const stick = document.getElementById('stick');
        let isTouching = false;
        let startX, startY;

        joystickArea.addEventListener('touchstart', (e) => {
            isTouching = true;
            const touch = e.touches[0];
            const rect = joystickArea.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            const touch = e.touches[0];
            let dx = touch.clientX - startX;
            let dy = touch.clientY - startY;
            let dist = Math.sqrt(dx * dx + dy * dy);
            let maxDist = 40;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            stick.style.transform = `translate(${dx}px, ${dy}px)`;
        });

        window.addEventListener('touchend', () => {
            isTouching = false;
            stick.style.transform = `translate(0px, 0px)`;
        });
    </script>
</body>
</html>
