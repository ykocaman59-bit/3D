<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Oyun Topluluğu - Saklambaç Haritası</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Arka Plan Görseli / Oda Sahnesi */
        #game-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1000&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
        }

        /* Üst Bilgi Barı */
        #top-bar {
            position: absolute; top: 15px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 20; pointer-events: none;
        }
        .badge {
            background: rgba(0, 0, 0, 0.6); color: white; padding: 6px 14px;
            border-radius: 20px; font-size: 13px; font-weight: bold; border: 1px solid rgba(255,255,255,0.3);
        }
        .timer { background: rgba(0, 0, 0, 0.7); color: #fbbf24; }

        /* Oda İsmi Göstergesi */
        #room-title {
            position: absolute; bottom: 110px; left: 30px;
            background: rgba(0, 0, 0, 0.7); color: white; padding: 8px 18px;
            border-radius: 8px; font-size: 16px; font-weight: bold; z-index: 20;
            border-left: 4px solid #3b82f6;
        }

        /* Sol Alt Joystick (Görsel Tasarım) */
        #joystick-area {
            position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.12); border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4); z-index: 20;
            touch-action: none;
        }
        #stick {
            position: absolute; top: 40px; left: 40px; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.9); border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: none;
            transition: transform 0.05s ease-out;
        }

        /* Sağ Alt Aksiyon Tuşları (Objeye Dönüş / Menü) */
        #right-buttons {
            position: absolute; bottom: 30px; right: 30px;
            display: flex; flex-direction: column; gap: 15px; z-index: 20;
        }
        .action-btn {
            width: 65px; height: 65px; background: #3b82f6; border-radius: 50%;
            border: 3px solid white; color: white; font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); cursor: pointer;
        }
        .action-btn.secondary { background: #1e293b; font-size: 20px; }

        /* Oda Seçim Menüsü (Üst Sağ / Alt Panel Alternatifi) */
        #room-selector {
            position: absolute; top: 70px; right: 20px;
            background: rgba(15, 23, 42, 0.85); padding: 10px; border-radius: 12px;
            z-index: 20; border: 1px solid rgba(255,255,255,0.2); max-height: 250px; overflow-y: auto;
        }
        .room-opt {
            color: white; padding: 6px 12px; font-size: 13px; cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left;
        }
        .room-opt:hover { background: #3b82f6; border-radius: 6px; }
    </style>
</head>
<body>

    <div id="game-screen"></div>

    <!-- Üst Bar -->
    <div id="top-bar">
        <div class="badge">👤 Saklan: 16/16</div>
        <div class="badge timer">⏱️ 03:00</div>
        <div class="badge" onclick="toggleMenu()" style="cursor:pointer;">🏠 Odalar</div>
    </div>

    <!-- Oda Değiştirme Menüsü -->
    <div id="room-selector" style="display:none;">
        <div class="room-opt" onclick="changeRoom('Giriş Holü', 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1000&auto=format&fit=crop')">Giriş Holü</div>
        <div class="room-opt" onclick="changeRoom('Mutfak', 'https://images.unsplash.com/photo-1556911220-e15b29be8c8f?q=80&w=1000&auto=format&fit=crop')">Mutfak</div>
        <div class="room-opt" onclick="changeRoom('Oturma Odası', 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?q=80&w=1000&auto=format&fit=crop')">Oturma Odası</div>
        <div class="room-opt" onclick="changeRoom('Yatak Odası', 'https://images.unsplash.com/photo-1595526114035-0d45ed16cfbf?q=80&w=1000&auto=format&fit=crop')">Yatak Odası</div>
        <div class="room-opt" onclick="changeRoom('Banyo', 'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=1000&auto=format&fit=crop')">Banyo</div>
        <div class="room-opt" onclick="changeRoom('Garaj', 'https://images.unsplash.com/photo-1506521781263-d8422e82f27a?q=80&w=1000&auto=format&fit=crop')">Garaj</div>
        <div class="room-opt" onclick="changeRoom('Bahçe / Kamelya', 'https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?q=80&w=1000&auto=format&fit=crop')">Bahçe / Kamelya</div>
    </div>

    <!-- Aktif Oda İsmi -->
    <div id="room-title">Giriş Holü</div>

    <!-- Sol Alt Joystick -->
    <div id="joystick-area">
        <div id="stick"></div>
    </div>

    <!-- Sağ Alt Butonlar -->
    <div id="right-buttons">
        <div class="action-btn secondary" onclick="alert('Objeye dönüşme aktif!')">📦</div>
        <div class="action-btn" onclick="alert('Aksiyon / Etkileşim!')">✨</div>
    </div>

    <script>
        // Oda Değiştirme Fonksiyonu
        function changeRoom(name, imageUrl) {
            document.getElementById('room-title').innerText = name;
            document.getElementById('game-screen').style.backgroundImage = `url('${imageUrl}')`;
            document.getElementById('room-selector').style.display = 'none';
        }

        function toggleMenu() {
            const menu = document.getElementById('room-selector');
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }

        // Joystick Dokunma ve Hareket Efekti
        const joystickArea = document.getElementById('joystick-area');
        const stick = document.getElementById('stick');
        let isTouching = false;
        let startX, startY;

        joystickArea.addEventListener('touchstart', (e) => {
            isTouching = true;
            const touch = e.touches[0];
            const rect = joystickArea.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            const touch = e.touches[0];
            let dx = touch.clientX - startX;
            let dy = touch.clientY - startY;
            let dist = Math.sqrt(dx * dx + dy * dy);
            let maxDist = 40;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            stick.style.transform = `translate(${dx}px, ${dy}px)`;
        });

        window.addEventListener('touchend', () => {
            isTouching = false;
            stick.style.transform = `translate(0px, 0px)`;
        });
    </script>
</body>
</html>
