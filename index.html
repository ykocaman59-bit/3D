<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Saklambaç 3D - Oyun</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0f19; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 15px; left: 15px; color: white; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 10px; font-weight: bold; z-index: 10; pointer-events: none; }
        #joystick { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); z-index: 10; }
        #stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: white; border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">🎮 3D Karakter ve Hareket Testi</div>
    <div id="joystick"><div id="stick"></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Sahne, Kamera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e293b);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Işık
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Zemin (Odalar)
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            new THREE.MeshStandardMaterial({ color: 0x334155 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Referans Kutuları (Odaları ve duvarları hissettirmek için)
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
        for(let i = -10; i <= 10; i += 5) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), boxMat);
            wall.position.set(i, 1, -10);
            scene.add(wall);
        }

        // 3D Karakter (Silindir Gövde + Kafa)
        const player = new THREE.Group();
        
        const body = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.3, 1.2, 16),
            new THREE.MeshStandardMaterial({ color: 0xef4444 })
        );
        body.position.y = 0.6;
        player.add(body);

        const head = new THREE.Mesh(
            new THREE.SphereGeometry(0.25, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0xfde047 })
        );
        head.position.y = 1.35;
        player.add(head);

        scene.add(player);
        player.position.set(0, 0, 0);

        // Joystick Mantığı
        let moveX = 0, moveY = 0, isJoyActive = false, touchId = null;
        let startX = 0, startY = 0;
        const joystick = document.getElementById('joystick');
        const stick = document.getElementById('stick');

        joystick.addEventListener('touchstart', (e) => {
            const t = e.changedTouches[0];
            touchId = t.identifier;
            const r = joystick.getBoundingClientRect();
            startX = r.left + r.width / 2;
            startY = r.top + r.height / 2;
            isJoyActive = true;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isJoyActive) return;
            for (let t of e.changedTouches) {
                if (t.identifier === touchId) {
                    let dx = t.clientX - startX;
                    let dy = t.clientY - startY;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let maxD = 40;
                    if (dist > maxD) {
                        dx = (dx / dist) * maxD;
                        dy = (dy / dist) * maxD;
                    }
                    stick.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveX = dx / maxD;
                    moveY = dy / maxD;
                }
            }
        });

        const endJoy = (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === touchId) {
                    isJoyActive = false;
                    stick.style.transform = `translate(0px, 0px)`;
                    moveX = 0; moveY = 0;
                }
            }
        };
        joystick.addEventListener('touchend', endJoy);
        joystick.addEventListener('touchcancel', endJoy);

        // Oyun Döngüsü
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (moveX !== 0 || moveY !== 0) {
                const speed = 6 * delta;
                player.position.x += moveX * speed;
                player.position.z += moveY * speed;
                player.rotation.y = Math.atan2(moveX, moveY);
            }

            // TPS Kamera (Arkadan Takip)
            camera.position.x = player.position.x;
            camera.position.y = player.position.y + 3.5;
            camera.position.z = player.position.z + 5;
            camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
