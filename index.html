<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Oyun Topluluğu - Saklambaç Haritası</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; color: white; pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10; font-size: 15px; }
        #top-bar { position: absolute; top: 15px; left: 20px; color: #fff; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; z-index: 10; border: 1px solid rgba(255,255,255,0.2); }
        
        /* Joystick Tasarımı */
        #joystick-area { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); z-index: 10; touch-action: none; }
        #stick { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* Sağ Alt Kontrol Butonları (Videodaki gibi) */
        #action-btn { position: absolute; bottom: 50px; right: 40px; width: 70px; height: 70px; background: #3b82f6; border-radius: 50%; border: 3px solid white; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    </style>
</head>
<body>
    <div id="top-bar">👤 Saklan: 16/16 &nbsp;|&nbsp; ⏱️ 03:00</div>
    <div id="ui"><b>Oyun Topluluğu - Saklambaç Haritası</b><br>Sol alttan hareket et, sağ ekrana dokunup etrafa bak!</div>
    
    <div id="joystick-area"><div id="stick"></div></div>
    <div id="action-btn">🧸</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e293b);
        scene.fog = new THREE.FogExp2(0x1e293b, 0.025);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Sıcak İç Mekan Işıklandırması
        const ambientLight = new THREE.AmbientLight(0xffedd5, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff7ed, 0.8);
        sunLight.position.set(10, 25, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- HARİTA VE ODA ELEMANLARI (VİDEODAKİ DETAYLAR) ---
        
        // Zemin
        const floorGeo = new THREE.PlaneGeometry(40, 35);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Oda Oluşturucu Yardımcısı (Zemin + Duvarlar + Eşyalar)
        function createRoom(x, z, w, d, floorColor, wallColor, roomName) {
            // Oda Zemini
            const rFloor = new THREE.Mesh(
                new THREE.PlaneGeometry(w - 0.2, d - 0.2),
                new THREE.MeshStandardMaterial({ color: floorColor, roughness: 0.4 })
            );
            rFloor.rotation.x = -Math.PI / 2;
            rFloor.position.set(x, 0.02, z);
            scene.add(rFloor);

            // Odalar Arası Duvarlar
            const wallMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.7 });
            const h = 2.5;
            
            // Arka duvar
            const bw = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.2), wallMat);
            bw.position.set(x, h/2, z - d/2);
            scene.add(bw);
            // Ön duvar
            const fw = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.2), wallMat);
            fw.position.set(x, h/2, z + d/2);
            scene.add(fw);
            // Sağ duvar
            const rw = new THREE.Mesh(new THREE.BoxGeometry(0.2, h, d), wallMat);
            rw.position.set(x + w/2, h/2, z);
            scene.add(rw);
            // Sol duvar
            const lw = new THREE.Mesh(new THREE.BoxGeometry(0.2, h, d), wallMat);
            lw.position.set(x - w/2, h/2, z);
            scene.add(lw);
        }

        // --- VİDEODAKİ PLANIN BİREBİR ODALARI ---
        // Üst Sıra
        createRoom(-7, -6, 4, 3, 0x475569, 0x1e293b, "Ahır/Depo");
        createRoom(-3, -6, 4, 3, 0xd97706, 0xb45309, "Mutfak");   // Ahşap tonları
        createRoom(1, -6, 4, 3, 0xfef08a, 0xca8a04, "Giriş Holü"); // Açık sarı halılı hol
        createRoom(5, -6, 4, 3, 0x1d4ed8, 0x1e40af, "Oturma Odası"); // Mavi koltuklu oda
        createRoom(9, -6, 4, 3, 0xf43f5e, 0x9f1239, "Yatak Odası"); // Pembe yatak odası

        // Orta Sıra
        createRoom(-7, -2, 4, 3, 0x0284c7, 0x0369a1, "Banyo");     // Mavi seramik banyo
        createRoom(-3, -2, 4, 3, 0xb45309, 0x78350f, "Yemek Odası");
        createRoom(1, -2, 4, 3, 0x64748b, 0x334155, "Merdiven / Koridor");
        createRoom(5, -2, 4, 3, 0x475569, 0x1e293b, "Çalışma Odası");
        createRoom(9, -2, 4, 3, 0x334155, 0x0f172a, "Garaj");     // Garaj (Araba için)

        // Alt Sıra (Teras ve Bahçe / Kamelya)
        createRoom(1, 3, 10, 4, 0x15803d, 0x14532d, "Teras / Bahçe");
        createRoom(8, 4, 5, 4, 0x166534, 0x064e3b, "Kamelya");

        // --- İÇ MEKAN ÖZEL NESNELERİ (Videodaki atmosferi veren detaylar) ---
        // Oturma Odası Koltuğu (Mavi)
        const sofa = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 1), new THREE.MeshStandardMaterial({color: 0x3b82f6}));
        sofa.position.set(5, 0.4, -6);
        scene.add(sofa);

        // Mutfak Masası
        const table = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 1.2), new THREE.MeshStandardMaterial({color: 0x854d0e}));
        table.position.set(-3, 0.4, -6);
        scene.add(table);

        // Yatak Odası Yatağı (Pembe)
        const bed = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 1.5), new THREE.MeshStandardMaterial({color: 0xf43f5e}));
        bed.position.set(9, 0.3, -6);
        scene.add(bed);

        // Garajdaki Araba (Videodaki gri araba)
        const carBody = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 3), new THREE.MeshStandardMaterial({color: 0x94a3b8, metalness: 0.6}));
        carBody.position.set(9, 0.45, -2);
        scene.add(carBody);


        // --- KONTROL SİSTEMİ (Joystick + Kamera Dönüşü) ---
        let lon = 0, lat = 0;
        let isRightDragging = false, prevTouchX = 0, prevTouchY = 0;
        
        let joyActive = false, joyTouchId = null;
        let joyCenterX = 0, joyCenterY = 0;
        let moveX = 0, moveY = 0;

        const joystickArea = document.getElementById('joystick-area');
        const stick = document.getElementById('stick');

        // Joystick Dokunma Başlangıcı
        joystickArea.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            joyTouchId = touch.identifier;
            const rect = joystickArea.getBoundingClientRect();
            joyCenterX = rect.left + rect.width / 2;
            joyCenterY = rect.top + rect.height / 2;
            joyActive = true;
        }, { passive: false });

        // Joystick Hareketi
        joystickArea.addEventListener('touchmove', (e) => {
            if (!joyActive) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joyTouchId) {
                    let dx = touch.clientX - joyCenterX;
                    let dy = touch.clientY - joyCenterY;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let maxDist = 45;
                    
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    
                    stick.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveX = dx / maxDist;
                    moveY = dy / maxDist;
                }
            }
        }, { passive: false });

        // Joystick Bitişi
        const endJoystick = (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    joyActive = false;
                    joyTouchId = null;
                    stick.style.transform = `translate(0px, 0px)`;
                    moveX = 0;
                    moveY = 0;
                }
            }
        };
        joystickArea.addEventListener('touchend', endJoystick);
        joystickArea.addEventListener('touchcancel', endJoystick);


        // Sağ Ekran ile Etrafa Bakış (Kamera Dönüşü)
        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.touches.length; i++) {
                // Eğer sol alttaki joystick alanına dokunulmadıysa sağ ekranı kontrol et
                if (e.touches[i].clientX > window.innerWidth / 3 || e.touches[i].clientY < window.innerHeight - 180) {
                    isRightDragging = true;
                    prevTouchX = e.touches[i].clientX;
                    prevTouchY = e.touches[i].clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isRightDragging) return;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX > window.innerWidth / 3 || e.touches[i].clientY < window.innerHeight - 180) {
                    let deltaX = e.touches[i].clientX - prevTouchX;
                    let deltaY = e.touches[i].clientY - prevTouchY;
                    
                    lon -= deltaX * 0.4;
                    lat += deltaY * 0.4;
                    lat = Math.max(-75, Math.min(75, lat)); // Kameranın takla atmasını önle
                    
                    prevTouchX = e.touches[i].clientX;
                    prevTouchY = e.touches[i].clientY;
                }
            }
        });

        window.addEventListener('touchend', () => { isRightDragging = false; });

        // Bilgisayardan Test Etmek İçin Fare Desteği
        let mouseLook = false, mouseX = 0, mouseY = 0;
        window.addEventListener('mousedown', (e) => { mouseLook = true; mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('mouseup', () => { mouseLook = false; });
        window.addEventListener('mousemove', (e) => {
            if (!mouseLook) return;
            lon -= (e.clientX - mouseX) * 0.3;
            lat += (e.clientY - mouseY) * 0.3;
            lat = Math.max(-75, Math.min(75, lat));
            mouseX = e.clientX; mouseY = e.clientY;
        });

        // --- ANİMASYON VE HAREKET DÖNGÜSÜ ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Yürüme Mantığı (Joystick Yönüne Göre)
            if (moveX !== 0 || moveY !== 0) {
                const speed = 5.5 * delta;
                const rad = THREE.MathUtils.degToRad(lon);
                
                // İleri-Geri ve Sağ-Sol yönlerinin kamera açısıyla tam uyumu
                camera.position.x += (moveY * Math.sin(rad) + moveX * Math.cos(rad)) * speed;
                camera.position.z += (-moveY * Math.cos(rad) + moveX * Math.sin(rad)) * speed;
            }

            // Kamera Bakış Açısını Güncelle
            let phi = THREE.MathUtils.degToRad(90 - lat);
            let theta = THREE.MathUtils.degToRad(lon);
            let target = new THREE.Vector3(
                camera.position.x + 100 * Math.sin(phi) * Math.cos(theta),
                camera.position.y + 100 * Math.cos(phi),
                camera.position.z + 100 * Math.sin(phi) * Math.sin(theta)
            );
            camera.lookAt(target);

            renderer.render(scene, camera);
        }
        animate();

        // Ekran Boyutu Değişimi
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
